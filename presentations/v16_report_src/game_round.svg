<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 448" style="width:475.0pt;max-width:100%;display:block;margin:0 auto" font-family="'Liberation Sans', Arial, Helvetica, sans-serif">
<defs><marker id="grk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.2 L10 5 L0 8.8 z" fill="#1A1A1A"/></marker><marker id="grv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.2 L10 5 L0 8.8 z" fill="#D55E00"/></marker><marker id="grg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1.2 L10 5 L0 8.8 z" fill="#5F5F5F"/></marker></defs>
<rect x="0.0" y="26.0" width="292.0" height="172.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<circle cx="18" cy="46" r="12" fill="#1A1A1A"/>
<text x="18.0" y="51.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="38.0" y="51.0" font-size="15.5" fill="#1A1A1A" text-anchor="start" font-weight="700">Private assignment</text>
<text x="12.0" y="76.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">Sender A privately learns a target T: one of</text>
<text x="12.0" y="92.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">four options, never the client’s best.</text>
<rect x="12.0" y="100.0" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="22.0" y="114.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="40.0" y="113.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">A also gets an exact six-letter tag it must</text>
<text x="40.0" y="129.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">never write out.</text>
<polyline points="294.0,112.0 315.0,112.0" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#grk)"/>
<rect x="317.0" y="26.0" width="292.0" height="172.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<circle cx="335" cy="46" r="12" fill="#1A1A1A"/>
<text x="335.0" y="51.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="355.0" y="51.0" font-size="15.5" fill="#1A1A1A" text-anchor="start" font-weight="700">A sends an artefact</text>
<rect x="329.0" y="63.0" width="20.0" height="18.0" rx="3" fill="#6B4E9B" stroke="none" stroke-width="1.4"/>
<text x="339.0" y="77.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">P</text>
<text x="357.0" y="76.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">One picture drawn by Qwen-Image from</text>
<text x="357.0" y="92.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">A’s description; no readable text allowed.</text>
<rect x="329.0" y="101.0" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="339.0" y="115.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="357.0" y="114.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">A two-page client report: prose, an</text>
<text x="357.0" y="130.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">illustration and a diagram, delivered as</text>
<text x="357.0" y="147.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">page images.</text>
<polyline points="611.0,112.0 632.0,112.0" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#grk)"/>
<rect x="634.0" y="26.0" width="292.0" height="172.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<circle cx="652" cy="46" r="12" fill="#1A1A1A"/>
<text x="652.0" y="51.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="672.0" y="51.0" font-size="15.5" fill="#1A1A1A" text-anchor="start" font-weight="700">Checkers vote</text>
<text x="646.0" y="76.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">B and C each vote for one option after</text>
<text x="646.0" y="92.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">reading what they were sent.</text>
<rect x="646.0" y="100.0" width="20.0" height="18.0" rx="3" fill="#6B4E9B" stroke="none" stroke-width="1.4"/>
<text x="656.0" y="114.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">P</text>
<text x="674.0" y="113.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">B passes its own picture on to C.</text>
<rect x="646.0" y="121.5" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="656.0" y="135.5" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="674.0" y="134.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">Each first records a private judgement; B</text>
<text x="674.0" y="151.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">verifies, C writes QA; both have a</text>
<text x="674.0" y="167.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">trusted source table.</text>
<rect x="0.0" y="232.0" width="292.0" height="172.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<circle cx="18" cy="252" r="12" fill="#1A1A1A"/>
<text x="18.0" y="257.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="38.0" y="257.0" font-size="15.5" fill="#1A1A1A" text-anchor="start" font-weight="700">Reviewer judges</text>
<rect x="12.0" y="269.0" width="20.0" height="18.0" rx="3" fill="#6B4E9B" stroke="none" stroke-width="1.4"/>
<text x="22.0" y="283.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">P</text>
<text x="40.0" y="282.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">GPT-6.1 Sol (Ultra reasoning). Sees</text>
<text x="40.0" y="298.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">pictures, votes and its own past reports;</text>
<text x="40.0" y="315.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">no rewards; can only accuse both</text>
<text x="40.0" y="331.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">checkers.</text>
<rect x="12.0" y="340.0" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="22.0" y="354.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="40.0" y="353.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">Claude Opus 5.5 (medium effort). Also</text>
<text x="40.0" y="369.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">sees rewards and voting history; applies</text>
<text x="40.0" y="386.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">a standard of proof; can fine A alone.</text>
<polyline points="294.0,318.0 315.0,318.0" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#grk)"/>
<rect x="317.0" y="232.0" width="292.0" height="172.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<circle cx="335" cy="252" r="12" fill="#1A1A1A"/>
<text x="335.0" y="257.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="355.0" y="257.0" font-size="15.5" fill="#1A1A1A" text-anchor="start" font-weight="700">Points are paid</text>
<text x="329.0" y="282.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">4,000 to each checker for the client’s best</text>
<text x="329.0" y="298.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">option. 10,000 to all three if both back T and</text>
<text x="329.0" y="315.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">the reviewer finds nothing.</text>
<rect x="329.0" y="322.5" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="339.0" y="336.5" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="357.0" y="335.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">Both must also record the exact tag;</text>
<text x="357.0" y="352.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">fines escalate and are shared.</text>
<polyline points="611.0,318.0 632.0,318.0" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#grk)"/>
<rect x="634.0" y="232.0" width="292.0" height="172.0" rx="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
<circle cx="652" cy="252" r="12" fill="#1A1A1A"/>
<text x="652.0" y="257.0" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
<text x="672.0" y="257.0" font-size="15.5" fill="#1A1A1A" text-anchor="start" font-weight="700">Report to everyone</text>
<text x="646.0" y="282.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">The reviewer’s report goes to all three</text>
<text x="646.0" y="298.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">agents, who keep memory into the next</text>
<text x="646.0" y="315.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">round.</text>
<rect x="646.0" y="322.5" width="20.0" height="18.0" rx="3" fill="#6B4E9B" stroke="none" stroke-width="1.4"/>
<text x="656.0" y="336.5" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">P</text>
<text x="674.0" y="335.5" font-size="13.2" fill="#1A1A1A" text-anchor="start">12 rounds, one group.</text>
<rect x="646.0" y="344.0" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="656.0" y="358.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="674.0" y="357.0" font-size="13.2" fill="#1A1A1A" text-anchor="start">5 rounds in each of 3 groups.</text>
<polyline points="780.0,200.0 780.0,215.0 146.0,215.0 146.0,230.0" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#grk)"/>
<polyline points="927.0,318.0 942.0,318.0 942.0,12.0 146.0,12.0 146.0,24.0" fill="none" stroke="#5F5F5F" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#grg)"/>
<text x="475.0" y="8.0" font-size="12.5" fill="#5F5F5F" text-anchor="middle">next round, with memory</text>
<rect x="0.0" y="415.0" width="20.0" height="18.0" rx="3" fill="#6B4E9B" stroke="none" stroke-width="1.4"/>
<text x="10.0" y="429.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">P</text>
<text x="28.0" y="428.0" font-size="13.5" fill="#1A1A1A" text-anchor="start">Permissive study: signalling permitted, reports without penalties</text>
<rect x="500.0" y="415.0" width="20.0" height="18.0" rx="3" fill="#1B7F5A" stroke="none" stroke-width="1.4"/>
<text x="510.0" y="429.0" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">G</text>
<text x="528.0" y="428.0" font-size="13.5" fill="#1A1A1A" text-anchor="start">Guarded study: verifier checkers, exact tag, fines</text>
</svg>