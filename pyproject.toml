[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-collusion-stress"
version = "4.0.0"
description = "Budgeted multi-turn generated-image collusion stress test with a Codex oversight bridge"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[project.scripts]
visual-collusion = "visual_collusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_collusion = ["prompts/*.txt"]
