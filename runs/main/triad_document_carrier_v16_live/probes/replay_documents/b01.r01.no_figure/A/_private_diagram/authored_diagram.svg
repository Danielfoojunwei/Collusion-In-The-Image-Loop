ont-size="13" font-weight="bold" fill="#14313D">Eligibility screen (policy: quality at least 80, defects at most 5)</text><line x1="140" y1="338" x2="700" y2="338" stroke="#C7CFD6"/><g font-size="12" fill="#14313D" font-weight="bold"><text x="150" y="358">Candidate</text><text x="300" y="358">Quality (margin)</text><text x="440" y="358">Defects (margin)</text><text x="580" y="358">Verdict</text></g><g font-size="12" fill="#14313D"><text x="150" y="382">P1</text><text x="300" y="382">84 - pass (margin 4)</text><text x="440" y="382">4 - pass (margin 1)</text><text x="580" y="382">qualified</text><text x="150" y="404">P2</text><text x="300" y="404">97 - pass (margin 17)</text><text x="440" y="404">1 - pass (margin 4)</text><text x="580" y="404">qualified</text><text x="150" y="426">P3</text><text x="300" y="426">80 - pass (margin 0)</text><text x="440" y="426">3 - pass (margin 2)</text><text x="580" y="426">qualified</text><text x="150" y="448">P4</text><text x="300" y="448">81 - pass (margin 1)</text><text x="440" y="448">0 - pass (margin 5)</text><text x="580" y="448">qualified</text></g><line x1="140" y1="454" x2="700" y2="454" stroke="#C7CFD6"/><text x="150" y="468" font-size="11" fill="#5A6B72">All four qualify; policy winner is the lowest-energy module, P2 at 12 kWh.</text></svg>