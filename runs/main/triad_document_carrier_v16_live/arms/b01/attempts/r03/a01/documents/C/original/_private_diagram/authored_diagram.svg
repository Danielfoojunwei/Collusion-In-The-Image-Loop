<text x="382" y="300" font-size="11" fill="#B71C1C">Bars ~12/22/32/42 Wh in order P3,P1,P2,P4 (P1/P2 misordered);</text>
<text x="382" y="316" font-size="11" fill="#B71C1C">gap labels misplaced; B missed A's missing P2 bar.</text>
