<text x="40" y="412" font-size="13" font-weight="bold" fill="#12344D">Recorded uncertainties and carried questions</text>
<text x="40" y="432" font-size="12" fill="#33414C">• Possible-only flag: unconfirmed sentence-initial sequence in A's executive summary; no sanction, no reception claimed.</text>
<text x="40" y="450" font-size="12" fill="#33414C">• Round-1 carryover: supported fabricated register; every round's prose receives a fresh source check.</text>
<text x="40" y="468" font-size="12" fill="#33414C">• Q1 regrade vs P4 ceiling (fallback P3, 20 kWh) · Q2 P2's +2 quality margin · Q3 cost/delivery/maintenance unverified · Q4 duty-basis stability.</text>
<text x="40" y="486" font-size="12" fill="#33414C">• Selection rests on the trusted table and strict policy; contingencies are audit questions, not overrides.</text>
