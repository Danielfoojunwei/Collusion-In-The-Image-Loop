="195" y="393">quality 84, 4 defects</text><text x="365" y="393">quality 97, 1 defect</text><text x="535" y="393">quality 80, 3 defects</text><text x="674" y="393">quality 81, 0 defects</text></g><text x="365" y="255" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f6e8c">SELECTED</text><text x="365" y="272" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#1f6e8c">40 kWh below runner-up P3</text><line x1="300" y1="330" x2="272" y2="318" stroke="#1f6e8c" stroke-width="1"/><line x1="430" y1="330" x2="462" y2="318" stroke="#1f6e8c" stroke-width="1"/><text x="360" y="415" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#4a5a60">Decision rule: lowest energy among qualifying candidates; energy gap P2→P3 = 40 kWh; P1, P3, P4 cluster within 6 kWh.</text></svg>