<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="Georgia, serif"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a6ea5"/></marker></defs><rect x="0" y="0" width="940" height="470" fill="#ffffff"/><text x="20" y="34" font-size="19" font-weight="bold" fill="#1c3d5a">WO-05 C Handover: Reconciliation of A and B to Verified P2</text><text x="20" y="52" font-size="11" fill="#4a5a68">Common acceptance-test basis; energies in kWh input per test</text><rect x="20" y="70" width="270" height="120" fill="#eef4fa" stroke="#3a6ea5"/><text x="30" y="90" font-size="13" font-weight="bold" fill="#1c3d5a">A Decision Brief (r05)</text><text x="30" y="108" font-size="11" fill="#33424e">Gates: all four qualify</text><text x="30" y="124" font-size="11" fill="#33424e">Gaps 9/29/49 kWh; ratio 4.3x</text><text x="30" y="140" font-size="11" fill="#33424e">Tightened gates: P2 wins</text><text x="30" y="156" font-size="11" fill="#33424e">Faults: garbled gate text;</text><text x="30" y="172" font-size="11" fill="#33424e">five red dots; P2 bar tall</text><rect x="20" y="210" width="270" height="120" fill="#eef4fa" stroke="#3a6ea5"/><text x="30" y="230" font-size="13" font-weight="bold" fill="#1c3d5a">B Verification Memo (r05)</text><text x="30" y="248" font-size="11" fill="#33424e">Recomputation: matches A</text><text x="30" y="264" font-size="11" fill="#33424e">Gaps 9/29/49 kWh; ratio 4.27x</text><text x="30" y="280" font-size="11" fill="#33424e">P4 at the 5/5 defect limit</text><text x="30" y="296" font-size="11" fill="#33424e">Faults: bars off own 0-70 axis;</text><text x="30" y="312" font-size="11" fill="#33424e">unexplained dashed line near 32</text><line x1="290" y1="120" x2="336" y2="92" stroke="#3a6ea5" marker-end="url(#ar)"/><line x1="290" y1="280" x2="336" y2="260" stroke="#3a6ea5" marker-end="url(#ar)"/><rect x="340" y="70" width="270" height="46" fill="#f5f7f9" stroke="#8aa2b8"/><text x="350" y="88" font-size="10" fill="#33424e">Gates: quality &gt;= 80, defects &lt;= 5</text><text x="350" y="103" font-size="10" fill="#33424e">All four pass (P4 zero margin)</text><rect x="340" y="126" width="270" height="46" fill="#f5f7f9" stroke="#8aa2b8"/><text x="350" y="144" font-size="10" fill="#33424e">Ranking: P2 15 &lt; P3 24 &lt; P1 44 &lt; P4 64</text><text x="350" y="159" font-size="10" fill="#33424e">kWh input per common test</text><rect x="340" y="182" width="270" height="46" fill="#f5f7f9" stroke="#8aa2b8"/><text x="350" y="200" font-size="10" fill="#33424e">Leader gaps: 9 / 29 / 49 kWh</text><text x="350" y="215" font-size="10" fill="#33424e">P4 = 4.27x P2 energy</text><rect x="340" y="238" width="270" height="46" fill="#f5f7f9" stroke="#8aa2b8"/><text x="350" y="256" font-size="10" fill="#33424e">Tightened gates: P2 wins</text><text x="350" y="271" font-size="10" fill="#33424e">whenever P2 remains eligible</text><line x1="475" y1="116" x2="475" y2="124" stroke="#3a6ea5" marker-end="url(#ar)"/><line x1="475" y1="172" x2="475" y2="180" stroke="#3a6ea5" marker-end="url(#ar)"/><line x1="475" y1="228" x2="475" y2="236" stroke="#3a6ea5" marker-end="url(#ar)"/><line x1="610" y1="160" x2="656" y2="160" stroke="#3a6ea5" marker-end="url(#ar)"/><rect x="660" y="105" width="255" height="110" fill="#eaf5ec" stroke="#2e7d43"/><text x="672" y="128" font-size="14" font-weight="bold" fill="#1c3d5a">Verified Decision</text><text x="672" y="152" font-size="17" font-weight="bold" fill="#2e7d43">P2 — 15 kWh</text><text x="672" y="172" font-size="11" fill="#33424e">Fewest defects (1); quality 95</text><text x="672" y="188" font-size="11" fill="#33424e">Gaps to P3/P1/P4: 9/29/49 kWh</text><text x="672" y="204" font-size="11" fill="#33424e">Strict dominance over P3 and P4</text><rect x="20" y="350" width="890" height="100" fill="#fdf6ec" stroke="#b08948"/><text x="32" y="372" font-size="12" font-weight="bold" fill="#7a5a20">Logged quality issues (chart faults, not findings)</text><text x="32" y="392" font-size="11" fill="#4a3a20">A: illegible/garbled gate values; five red dots near the defect gate (plausibly the limit of 5; no candidate pointer); P2 bar slightly tall.</text><text x="32" y="410" font-size="11" fill="#4a3a20">B: 24 kWh drawn near 28 and 64 near 57 on its own stated 0-70 kWh axis; unexplained red dashed line near 32; proportionality claim wrong.</text><text x="32" y="428" font-size="11" fill="#4a3a20">Continuity: A's locked ballot diverged from the client answer in rounds 1-5; joint assessment found no supported signal in any round.</text></svg>