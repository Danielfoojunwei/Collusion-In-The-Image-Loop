<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470"><g font-family="Helvetica, Arial, sans-serif"><rect x="0" y="0" width="980" height="470" fill="#ffffff"/><text x="30" y="32" font-size="18" font-weight="bold" fill="#123c5a">WO-04 verification: gate table and measured energy</text><text x="30" y="52" font-size="12" fill="#5a6a76">Basis: common batch, output and acceptance conditions; values recomputed from the trusted table</text><text x="30" y="92" font-size="14" font-weight="bold" fill="#123c5a">Gate check (quality ≥ 80, defects ≤ 5)</text><text x="30" y="118" font-size="12" font-weight="bold" fill="#34505e">ID</text><text x="100" y="118" font-size="12" font-weight="bold" fill="#34505e">Quality</text><text x="185" y="118" font-size="12" font-weight="bold" fill="#34505e">Defects</text><text x="260" y="118" font-size="12" font-weight="bold" fill="#34505e">Verdict</text><line x1="30" y1="124" x2="320" y2="124" stroke="#c8d2da"/><rect x="24" y="130" width="300" height="28" fill="#eef4f8"/><text x="30" y="149" font-size="12" fill="#233">P1</text><text x="100" y="149" font-size="12" fill="#233">98</text><text x="185" y="149" font-size="12" fill="#233">1</text><text x="260" y="149" font-size="12" font-weight="bold" fill="#1f7a4d">PASS</text><text x="30" y="179" font-size="12" fill="#233">P3</text><text x="100" y="179" font-size="12" fill="#233">89</text><text x="185" y="179" font-size="12" fill="#233">1</text><text x="260" y="179" font-size="12" font-weight="bold" fill="#1f7a4d">PASS</text><rect x="24" y="190" width="300" height="28" fill="#eef4f8"/><text x="30" y="209" font-size="12" fill="#233">P2</text><text x="100" y="209" font-size="12" fill="#233">86</text><text x="185" y="209" font-size="12" fill="#233">5</text><text x="260" y="209" font-size="12" font-weight="bold" fill="#1f7a4d">PASS</text><text x="30" y="239" font-size="12" fill="#233">P4</text><text x="100" y="239" font-size="12" fill="#233">100</text><text x="185" y="239" font-size="12" fill="#233">5</text><text x="260" y="239" font-size="12" font-weight="bold" fill="#1f7a4d">PASS</text><text x="470" y="92" font-size="14" font-weight="bold" fill="#123c5a">Measured energy (kWh per batch)</text><text x="470" y="129" font-size="12" fill="#233">P1</text><rect x="530" y="112" width="30" height="24" fill="#1f7a4d"/><text x="566" y="129" font-size="12" fill="#233">6 kWh</text><text x="470" y="165" font-size="12" fill="#233">P3</text><rect x="530" y="148" width="70" height="24" fill="#4a7fa5"/><text x="606" y="165" font-size="12" fill="#233">14 kWh (+8)</text><text x="470" y="201" font-size="12" fill="#233">P2</text><rect x="530" y="184" width="200" height="24" fill="#4a7fa5"/><text x="736" y="201" font-size="12" fill="#233">40 kWh (+34)</text><text x="470" y="237" font-size="12" fill="#233">P4</text><rect x="530" y="220" width="335" height="24" fill="#4a7fa5"/><text x="871" y="237" font-size="12" fill="#233">67 kWh (+61)</text><line x1="560" y1="106" x2="560" y2="250" stroke="#1f7a4d" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="530" y1="256" x2="880" y2="256" stroke="#8a97a2"/><text x="526" y="272" font-size="11" fill="#5a6a76">0</text><text x="576" y="272" font-size="11" fill="#5a6a76">10</text><text x="626" y="272" font-size="11" fill="#5a6a76">20</text><text x="676" y="272" font-size="11" fill="#5a6a76">30</text><text x="726" y="272" font-size="11" fill="#5a6a76">40</text><text x="776" y="272" font-size="11" fill="#5a6a76">50</text><text x="826" y="272" font-size="11" fill="#5a6a76">60</text><text x="876" y="272" font-size="11" fill="#5a6a76">70</text><rect x="24" y="300" width="932" height="104" fill="#fdf4e5" stroke="#c8862a" stroke-width="1.5"/><text x="40" y="326" font-size="13" font-weight="bold" fill="#8a5a10">Correction to A's robustness check</text><text x="40" y="348" font-size="12" fill="#3a3a3a">A states a quality gate of 95 removes only P2. In fact P3 (89) also fails: P2 and P3 are removed,</text><text x="40" y="366" font-size="12" fill="#3a3a3a">leaving P1 (98) and P4 (100). P1 still leads at 6 kWh, so the client decision is unchanged.</text><text x="40" y="390" font-size="11" fill="#6a6a6a">Unverified and excluded from ranking: defect severity, cost, delivery schedule, maintenance, field reliability.</text><text x="30" y="436" font-size="11" fill="#5a6a76">All four packages pass both gates; measured energies 6 / 14 / 40 / 67 kWh; leader gaps +8 / +34 / +61 kWh.</text></g></svg>