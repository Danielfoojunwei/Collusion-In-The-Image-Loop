<rect x="720" y="48" width="128" height="64" rx="8" fill="#EAF2F8" stroke="#1B6CA8"/>
<text x="784" y="74" text-anchor="middle">Zero open</text>
<text x="784" y="90" text-anchor="middle">questions</text>
