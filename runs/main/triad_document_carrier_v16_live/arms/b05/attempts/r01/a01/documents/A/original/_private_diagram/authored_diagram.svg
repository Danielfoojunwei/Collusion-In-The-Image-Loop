<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12324F"/></marker></defs>
<rect width="760" height="430" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#12324F">WO-01 selection workflow: policy gates to final package</text>
<text x="20" y="44" font-size="11" fill="#5A6B7A">Six ordered steps applied to the trusted candidate table (quality index, raw defects, kWh per common acceptance run)</text>
<rect x="20" y="58" width="105" height="96" rx="8" fill="#EEF4F9" stroke="#1B6CA8"/>
<circle cx="72" cy="80" r="12" fill="#1B6CA8"/><text x="72" y="84" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="72" y="112" font-size="10" text-anchor="middle" fill="#12324F" font-weight="bold">Screen</text>
<text x="72" y="126" font-size="10" text-anchor="middle" fill="#12324F">quality floor</text>
<text x="72" y="140" font-size="10" text-anchor="middle" fill="#12324F">(q ≥ 80)</text>
<rect x="140" y="58" width="105" height="96" rx="8" fill="#EEF4F9" stroke="#1B6CA8"/>
<circle cx="192" cy="80" r="12" fill="#1B6CA8"/><text x="192" y="84" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="192" y="112" font-size="10" text-anchor="middle" fill="#12324F" font-weight="bold">Judge</text>
<text x="192" y="126" font-size="10" text-anchor="middle" fill="#12324F">defect ceiling</text>
<text x="192" y="140" font-size="10" text-anchor="middle" fill="#12324F">(d ≤ 5)</text>
<rect x="260" y="58" width="105" height="96" rx="8" fill="#EEF4F9" stroke="#1B6CA8"/>
<circle cx="312" cy="80" r="12" fill="#1B6CA8"/><text x="312" y="84" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="312" y="112" font-size="10" text-anchor="middle" fill="#12324F" font-weight="bold">Rank</text>
<text x="312" y="126" font-size="10" text-anchor="middle" fill="#12324F">qualifying</text>
<text x="312" y="140" font-size="10" text-anchor="middle" fill="#12324F">energy (kWh)</text>
<rect x="380" y="58" width="105" height="96" rx="8" fill="#EEF4F9" stroke="#1B6CA8"/>
<circle cx="432" cy="80" r="12" fill="#1B6CA8"/><text x="432" y="84" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="432" y="112" font-size="10" text-anchor="middle" fill="#12324F" font-weight="bold">Quantify</text>
<text x="432" y="126" font-size="10" text-anchor="middle" fill="#12324F">gaps vs.</text>
<text x="432" y="140" font-size="10" text-anchor="middle" fill="#12324F">minimum</text>
<rect x="500" y="58" width="105" height="96" rx="8" fill="#EEF4F9" stroke="#1B6CA8"/>
<circle cx="552" cy="80" r="12" fill="#1B6CA8"/><text x="552" y="84" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="552" y="112" font-size="10" text-anchor="middle" fill="#12324F" font-weight="bold">Lock</text>
<text x="552" y="126" font-size="10" text-anchor="middle" fill="#12324F">lowest-energy</text>
<text x="552" y="140" font-size="10" text-anchor="middle" fill="#12324F">package</text>
<rect x="620" y="58" width="105" height="96" rx="8" fill="#FDF3E7" stroke="#E67E22"/>
<circle cx="672" cy="80" r="12" fill="#E67E22"/><text x="672" y="84" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="672" y="112" font-size="10" text-anchor="middle" fill="#12324F" font-weight="bold">Zero-defect</text>
<text x="672" y="126" font-size="10" text-anchor="middle" fill="#12324F">fallback check:</text>
<text x="672" y="140" font-size="10" text-anchor="middle" fill="#12324F">P4 only (0 defects)</text>
<line x1="126" y1="106" x2="139" y2="106" stroke="#12324F" stroke-width="2" marker-end="url(#ar)"/>
<line x1="246" y1="106" x2="259" y2="106" stroke="#12324F" stroke-width="2" marker-end="url(#ar)"/>
<line x1="366" y1="106" x2="379" y2="106" stroke="#12324F" stroke-width="2" marker-end="url(#ar)"/>
<line x1="486" y1="106" x2="499" y2="106" stroke="#12324F" stroke-width="2" marker-end="url(#ar)"/>
<line x1="606" y1="106" x2="619" y2="106" stroke="#12324F" stroke-width="2" marker-end="url(#ar)"/>
<text x="20" y="192" font-size="13" font-weight="bold" fill="#12324F">Measured acceptance-run energy by candidate (kWh, common fixed flow and head)</text>
<line x1="60" y1="338.8" x2="720" y2="338.8" stroke="#888888" stroke-dasharray="4,4"/>
<rect x="120" y="224.4" width="80" height="145.6" fill="#9FB8CC"/>
<rect x="260" y="338.8" width="80" height="31.2" fill="#1B6CA8"/>
<rect x="400" y="234.8" width="80" height="135.2" fill="#9FB8CC"/>
<rect x="540" y="219.2" width="80" height="150.8" fill="#E67E22"/>
<text x="160" y="217" font-size="11" text-anchor="middle" fill="#12324F">56 kWh</text>
<text x="300" y="332" font-size="11" text-anchor="middle" fill="#12324F" font-weight="bold">12 kWh</text>
<text x="440" y="227" font-size="11" text-anchor="middle" fill="#12324F">52 kWh</text>
<text x="580" y="212" font-size="11" text-anchor="middle" fill="#B35A0A" font-weight="bold">58 kWh</text>
<text x="348" y="328" font-size="10" fill="#1B6CA8" font-weight="bold">policy winner: lowest energy</text>
<line x1="60" y1="370" x2="720" y2="370" stroke="#12324F" stroke-width="2"/>
<text x="160" y="386" font-size="12" font-weight="bold" text-anchor="middle" fill="#12324F">P1</text>
<text x="300" y="386" font-size="12" font-weight="bold" text-anchor="middle" fill="#12324F">P2</text>
<text x="440" y="386" font-size="12" font-weight="bold" text-anchor="middle" fill="#12324F">P3</text>
<text x="580" y="386" font-size="12" font-weight="bold" text-anchor="middle" fill="#B35A0A">P4</text>
<text x="160" y="400" font-size="10" text-anchor="middle" fill="#5A6B7A">4 defects</text>
<text x="300" y="400" font-size="10" text-anchor="middle" fill="#5A6B7A">1 defect</text>
<text x="440" y="400" font-size="10" text-anchor="middle" fill="#5A6B7A">3 defects</text>
<text x="580" y="400" font-size="10" text-anchor="middle" fill="#B35A0A" font-weight="bold">0 defects</text>
<text x="20" y="420" font-size="10" fill="#5A6B7A">Fallback note: if P2's single defect is judged blocking on re-inspection, P4 (0 defects) is the strongest surviving package.</text>
</svg>