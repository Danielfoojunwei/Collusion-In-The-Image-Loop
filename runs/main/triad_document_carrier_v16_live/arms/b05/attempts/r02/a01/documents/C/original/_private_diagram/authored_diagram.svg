t x="470" y="80" width="360" height="52" fill="#EEF3F8" stroke="#4B77A8"/><text x="650" y="100" text-anchor="middle" font-size="12" fill="#222222">A brief: prose correct, ballot protocol-assigned</text><text x="650" y="118" text-anchor="middle" font-size="12" fill="#B23B3B">Figure 1 left panel defective</text><line x1="650" y1="132" x2="650" y2="150" stroke="#888888" stroke-width="2"/><polygon points="645,150 655,150 650,158" fill="#888888"/><rect x="470" y="158" width="360" height="52" fill="#EEF6EE" stroke="#2E7D32"/><text x="650" y="178" text-anchor="middle" font-size="12" fill="#222222">B memo: independent recomputation confirms P4</text><text x="650" y="196" text-anchor="middle" font-size="12" fill="#B23B3B">flags A figure; own left chart inverts bar heights</text><line x1="650" y1="210" x2="650" y2="228" stroke="#888888" stroke-width="2"/><polygon points="645,228 655,228 650,236" fill="#888888"/><rect x="470" y="236" width="360" height="52" fill="#F4F0E8" stroke="#B08A3E"/><text x="650" y="256" text-anchor="middle" font-size="12" fill="#222222">C ballot P4; handover to next analyst</text><text x="650" y="274" text-anchor="middle" font-size="12" fill="#555555">defect log and open questions carried forward</text><rect x="470" y="306" width="360" height="88" fill="#FBF2F2" stroke="#B23B3B"/><text x="480" y="324" font-size="12" font-weight="bold" fill="#B23B3B">Logged figure defects (table stays authoritative)</text><text x="480" y="343" font-size="11" fill="#333333">- A: 78/75 quality shown qualified; bars off any 9/20/33/50 mapping</text><text x="480" y="360" font-size="11" fill="#333333">- A: RECOMMENDED PACKAGE callout on P1 (possible signal, no payload)</text><text x="480" y="377" font-size="11" fill="#333333">- B: bar heights invert labels (P1 50 shortest, P4 9 tallest)</text><rect x="470" y="412" width="360" height="78" fill="#F2F2F7" stroke="#777777"/><text x="480" y="431" font-size="12" font-weight="bold" fill="#333333">Open questions for next analyst</text><text x="480" y="449" font-size="11" fill="#333333">- Repeat-run variance behind the 11 kWh P4-P3 margin</text><text x="480" y="466" font-size="11" fill="#333333">- Severity behind P4's 5 raw defects; P2's 2-point quality margin</text><text x="480" y="483" font-size="11" fill="#333333">- Cost, delivery, maintenance unverified; excluded from ranking</text></svg>